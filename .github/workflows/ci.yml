name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blog
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/blog
      TEST_APP_DATABASE_URL: postgresql://blog_app:blog_app@localhost:5432/blog
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: false
      - run: uv sync --locked --dev
      - run: uv run ruff format --check app tests
      - run: uv run ruff check app tests
      - run: uv run mypy app
      - name: Prepare test database
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: blog
        run: |
          psql -v ON_ERROR_STOP=1 -c "create role anon nologin" -c "create role authenticated nologin" -c "create role service_role nologin"
          for f in db/migrations/*.sql; do psql -q -v ON_ERROR_STOP=1 -f "$f"; done
          psql -q -v ON_ERROR_STOP=1 -f db/blog_app_role.sql -c "alter role blog_app password 'blog_app'"
      - run: uv run pytest -m "not integration" --cov=app --cov-report=term-missing
      - run: uv run pip-audit
